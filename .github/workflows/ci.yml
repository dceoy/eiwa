name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1  # v3.2.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm run audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1  # v3.2.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - check
      - e2e
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    with:
      unconditional: true
