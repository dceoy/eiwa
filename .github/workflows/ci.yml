name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4  # v3.1.1
        with:
          install: false
          cache: true
      - name: Resolve Node.js runtime lock metadata
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          awk '/^  node@runtime:26\\.12\\.1:/ { printing=1 } printing { print } printing && /^    hasBin: true$/ { exit }' pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --no-runtime
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm run audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4  # v3.1.1
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile --no-runtime
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs:
      - check
      - e2e
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    with:
      unconditional: true
